version: '3'

# MAPBOX_TOKEN comes from .env and is embedded into the binary at build time.
dotenv: ['.env']

vars:
  APP_NAME: "exif-photos-helper"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "darwin:build"

  package:
    summary: Packages a production build of the application (.app bundle)
    cmds:
      - task: "darwin:package"

  run:
    summary: Runs the application
    cmds:
      - task: "darwin:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:
    summary: Runs Go tests
    cmds:
      - go test ./...
    env:
      CGO_CFLAGS: "-mmacosx-version-min=13.0"
      CGO_LDFLAGS: "-mmacosx-version-min=13.0"
